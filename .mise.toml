[tools]
"github:golangci/golangci-lint" = "latest"
"github:goreleaser/goreleaser" = "latest"
"github:sharkdp/fd" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:mvdan.cc/gofumpt" = "latest"
go = "latest"

[tasks.build]
description = "Build a binary"
run = "go build -o shebang"
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["shebang"]

[tasks.lint]
description = "Run a static analysis"
sources = ["**/*.go", "go.mod", "go.sum"]
run = "golangci-lint run"

[tasks.release]
description = "Create release tarballs"
sources = ["**/*.go", "go.mod", "go.sum", ".goreleaser.yaml", "README.md"]
run = [
    "goreleaser release --snapshot --clean",
    "fd --type directory . ./dist -X rm -rf",
    "rm ./dist/config.yaml",
    "rm ./dist/*.json",
]
