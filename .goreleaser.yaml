version: 2

project_name: shebang

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: default
    binary: '{{ .ProjectName }}'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

gomod:
  proxy: true

snapshot:
  version_template: '{{ .Now.Format "2006.01.02" }}'

source:
  enabled: true
  name_template: '{{ .ProjectName }}-sources'

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  disable: true
